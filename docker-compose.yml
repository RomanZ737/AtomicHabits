services:
  db:
    image: postgres:17
    restart: always
    env_file:
        - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine   # или redis:latest
    restart: always
    volumes:
      - redis_data:/data    # сохранение данных (если нужно)

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${DOCKER_HUB_USERNAME}/lms:${DOCKER_IMAGE_TAG:-latest}
    restart: always
    command: >
      bash -c "python manage.py migrate &&
                     gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    env_file:
      - .env

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data: